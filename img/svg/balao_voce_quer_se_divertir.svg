<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c93ff0"/>
      <stop offset="100%" stop-color="#6a1fb0"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="55%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff9b1f"/>
    </linearGradient>
  </defs>

  <!-- side spikes -->
  <polygon points="60,150 130,130 130,170" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="640,150 570,130 570,170" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="90,90 150,105 130,150" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="610,90 550,105 570,150" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>

  <!-- bubble tail -->
  <path d="M280 340 L260 400 L360 335 Z" fill="url(#purpleGrad)" stroke="#231409" stroke-width="10" stroke-linejoin="round"/>

  <!-- main bubble -->
  <rect x="110" y="40" width="480" height="300" rx="80" ry="80" fill="url(#purpleGrad)" stroke="#231409" stroke-width="12"/>

  <!-- gloss highlight -->
  <path d="M160 80 Q140 150 170 220" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"/>

  <!-- text -->
  <text x="350" y="165" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" font-style="italic"
        fill="url(#yellowGrad)" stroke="#231409" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
    Você quer
  </text>
  <text x="350" y="245" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" font-style="italic"
        fill="url(#yellowGrad)" stroke="#231409" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
    se divertir?
  </text>
</svg>
