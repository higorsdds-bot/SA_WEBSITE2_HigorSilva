<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8e63d"/>
      <stop offset="100%" stop-color="#2f9e2f"/>
    </linearGradient>
    <linearGradient id="yellowGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="55%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff9b1f"/>
    </linearGradient>
    <pattern id="dotsGreen" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#1f7a1f"/>
    </pattern>
  </defs>

  <!-- side spikes -->
  <polygon points="20,150 90,130 90,175" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="540,150 470,130 470,175" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>

  <!-- decorative dots -->
  <circle cx="470" cy="70" r="6" fill="#2f9e2f"/>
  <circle cx="330" cy="300" r="7" fill="#2f9e2f"/>
  <circle cx="60" cy="90" r="5" fill="#2f9e2f"/>

  <!-- bubble tail -->
  <path d="M180 250 L160 320 L260 245 Z" fill="url(#greenGrad)" stroke="#231409" stroke-width="10" stroke-linejoin="round"/>

  <!-- main bubble -->
  <rect x="90" y="60" width="380" height="200" rx="70" ry="70" fill="url(#greenGrad)" stroke="#231409" stroke-width="12"/>
  <rect x="90" y="60" width="380" height="200" rx="70" ry="70" fill="url(#dotsGreen)" fill-opacity="0.25"/>

  <!-- gloss highlight -->
  <path d="M130 90 Q112 150 138 205" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>

  <!-- text -->
  <text x="280" y="200" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="120" font-style="italic"
        fill="url(#yellowGrad2)" stroke="#231409" stroke-width="9" stroke-linejoin="round" paint-order="stroke">
    SIM
  </text>
</svg>
