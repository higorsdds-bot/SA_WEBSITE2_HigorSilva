<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#c2123a"/>
    </linearGradient>
    <linearGradient id="yellowGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="55%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff9b1f"/>
    </linearGradient>
    <pattern id="dotsRed" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#8f0c2b"/>
    </pattern>
  </defs>

  <!-- side spikes -->
  <polygon points="20,150 90,130 90,175" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="540,150 470,130 470,175" fill="#ffb238" stroke="#231409" stroke-width="7" stroke-linejoin="round"/>

  <!-- decorative dots -->
  <circle cx="460" cy="65" r="6" fill="#c2123a"/>
  <circle cx="320" cy="305" r="7" fill="#c2123a"/>
  <circle cx="70" cy="85" r="5" fill="#c2123a"/>
  <circle cx="500" cy="240" r="5" fill="#c2123a"/>

  <!-- bubble tail -->
  <path d="M300 250 L320 320 L220 245 Z" fill="url(#redGrad)" stroke="#231409" stroke-width="10" stroke-linejoin="round"/>

  <!-- main bubble -->
  <rect x="90" y="60" width="380" height="200" rx="70" ry="70" fill="url(#redGrad)" stroke="#231409" stroke-width="12"/>
  <rect x="90" y="60" width="380" height="200" rx="70" ry="70" fill="url(#dotsRed)" fill-opacity="0.25"/>

  <!-- gloss highlight -->
  <path d="M130 90 Q112 150 138 205" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>

  <!-- tilde over A -->
  <path d="M245 95 Q262 78 280 95 Q297 108 312 95" fill="none" stroke="#231409" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M247 92 Q262 80 278 92 Q294 103 310 92" fill="none" stroke="url(#yellowGrad3)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- text -->
  <text x="280" y="200" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="110" font-style="italic"
        fill="url(#yellowGrad3)" stroke="#231409" stroke-width="9" stroke-linejoin="round" paint-order="stroke">
    NÃO
  </text>
</svg>
