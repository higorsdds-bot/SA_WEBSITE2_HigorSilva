<!doctype html>
<html lang="PT-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contatos</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="./css/footerNav.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/Contato.css" />
    <link rel="icon" href="./img/party.png" />
  </head>

  <header>
    <nav class="nav-items">
      <a href="#" class="Nav"> Pagina Inicial</a>
      <a href="./compra.html" class="Nav"> Compra ingresso </a>
      <a href="./galeria.html" class="Nav"> Galeria </a>
    </nav>
  </header>

  <body>
    <form action="#">
      <h2>Formulário de Contato</h2>

      <!-- Nome -->
      <div>
        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          required
          placeholder="Nome completo"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="exemplo@gmail.com"
        />
      </div>

      <!-- Telefone -->
      <div>
        <label for="telefone">Telefone:</label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          placeholder="(027) 0000-0000"
        />
      </div>

      <!-- Assunto -->
      <div>
        <label for="assunto">Assunto:</label>
        <select id="assunto" name="assunto" required>
          <option value="" disabled selected>Selecione um assunto...</option>
          <option value="duvidas_ingressos">
            Dúvidas sobre Ingressos / Bilheteira
          </option>
          <option value="lineup_horarios">Line-up e Horários dos Shows</option>
          <option value="imprensa_credenciamento">
            Imprensa e Credenciamento
          </option>
          <option value="patrocinio_parcerias">Patrocínio e Parcerias</option>
          <option value="trabalhe_conosco">
            Quero Trabalhar / Tocar no Evento
          </option>
          <option value="achados_perdidos">Achados e Perdidos</option>
          <option value="outros">Outros Assuntos</option>
        </select>
      </div>

      <!-- Mensagem -->
      <div class="mensagem">
        <label for="mensagem">Descrição contato:</label>
      </div>
      <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

      <!-- Botão de Envio -->
      <div>
        <button class="botao2" type="submit">Enviar</button>
      </div>
    </form>

    <div class="card-icones">
      <div class="item-contato">
        <span
          >Instagram
          <i class="ph-bold ph-instagram-logo"></i>
        </span>
      </div>

      <div class="item-contato">
        <span>
          whatsaapp
          <i class="ph-bold ph-whatsapp-logo"></i>
        </span>
      </div>

      <div class="item-contato">
        <span>
          Facebook
          <i class="ph-bold ph-facebook-logo"></i>
        </span>
      </div>
    </div>
  </body>
</html>
